openapi: 3.0.3
info:
  title: Diário de Treinos API
  version: 1.0.0
  description: API REST para gerenciar treinos de academia com exercícios embutidos (MongoDB).
servers:
  - url: https://diario-treinos-devapi.vercel.app/api
    description: Produção (Vercel)
  - url: http://localhost:3000/api
    description: Local
tags:
  - name: Workouts
  - name: Exercises
  - name: Stats

paths:
  /workouts:
    post:
      tags: [Workouts]
      summary: Cria um treino
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkoutInput'
            example:
              title: Treino de Pernas
              date: "2026-11-22T08:00:00.000Z"
              durationMinutes: 45
              notes: Foco em agachamento
              exercises:
                - name: Agachamento Livre
                  muscleGroup: Pernas
                  equipment: Barra
                  sets: 4
                  reps: 8
                  weightKg: 60
                - name: Leg Press
                  muscleGroup: Pernas
                  equipment: Máquina
                  sets: 3
                  reps: 12
                  weightKg: 100
      responses:
        '201':
          description: Criado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workout'
        '400':
          $ref: '#/components/responses/BadRequest'
    get:
      tags: [Workouts]
      summary: Lista treinos com filtros e paginação
      parameters:
        - in: query
          name: muscleGroup
          schema:
            type: string
            enum: [Peito, Costas, Pernas, Ombros, Bíceps, Tríceps, Abdômen, Cardio]
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
        - in: query
          name: page
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          schema: { type: integer, default: 10 }
      responses:
        '200':
          description: Lista paginada
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  page: { type: integer }
                  limit: { type: integer }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Workout'

  /workouts/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    get:
      tags: [Workouts]
      summary: Busca treino por ID
      responses:
        '200':
          description: Encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workout'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Workouts]
      summary: Substitui o treino inteiro
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkoutInput'
      responses:
        '200':
          description: Atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workout'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Workouts]
      summary: Atualização parcial
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                notes: { type: string }
                durationMinutes: { type: integer }
      responses:
        '200':
          description: Atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workout'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Workouts]
      summary: Remove treino
      responses:
        '204':
          description: Removido
        '404':
          $ref: '#/components/responses/NotFound'

  /workouts/{id}/exercises:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    post:
      tags: [Exercises]
      summary: Adiciona exercício ao treino ($push)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExerciseInput'
            example:
              name: Cadeira Extensora
              muscleGroup: Pernas
              equipment: Máquina
              sets: 3
              reps: 15
              weightKg: 40
      responses:
        '201':
          description: Adicionado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workout'
        '404':
          $ref: '#/components/responses/NotFound'

  /workouts/{id}/exercises/{exerciseId}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
      - in: path
        name: exerciseId
        required: true
        schema: { type: string }
    patch:
      tags: [Exercises]
      summary: Atualiza um exercício específico (arrayFilters)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sets: { type: integer }
                reps: { type: integer }
                weightKg: { type: number }
            example:
              weightKg: 45
              reps: 12
      responses:
        '200':
          description: Atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workout'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Exercises]
      summary: Remove exercício do treino ($pull)
      responses:
        '204':
          description: Removido
        '404':
          $ref: '#/components/responses/NotFound'

  /workouts/stats:
    get:
      tags: [Stats]
      summary: Volume total por grupo muscular no período
      parameters:
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
      responses:
        '200':
          description: Agregação
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    muscleGroup: { type: string }
                    totalVolumeKg: { type: number }
                    totalSets: { type: integer }

components:
  schemas:
    ExerciseInput:
      type: object
      required: [name, muscleGroup, sets, reps]
      properties:
        name: { type: string }
        muscleGroup:
          type: string
          enum: [Peito, Costas, Pernas, Ombros, Bíceps, Tríceps, Abdômen, Cardio]
        equipment: { type: string }
        sets: { type: integer, minimum: 1 }
        reps: { type: integer, minimum: 1 }
        weightKg: { type: number, minimum: 0 }
    Exercise:
      allOf:
        - $ref: '#/components/schemas/ExerciseInput'
        - type: object
          properties:
            _id: { type: string }
    WorkoutInput:
      type: object
      required: [title, date, exercises]
      properties:
        title: { type: string }
        date: { type: string, format: date-time }
        durationMinutes: { type: integer, minimum: 1 }
        notes: { type: string }
        exercises:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ExerciseInput'
    Workout:
      allOf:
        - $ref: '#/components/schemas/WorkoutInput'
        - type: object
          properties:
            _id: { type: string }
            exercises:
              type: array
              items:
                $ref: '#/components/schemas/Exercise'
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
  responses:
    BadRequest:
      description: Dados inválidos
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
              errors:
                type: array
                items: { type: string }
    NotFound:
      description: Não encontrado
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }