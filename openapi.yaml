openapi: 3.0.3
info:
  title: Diário de Treinos API
  version: 1.0.0
  description: |
    API REST para gerenciamento de treinos de academia, utilizando MongoDB como banco de dados de documentos.

    **Funcionalidades:**
    - CRUD completo de treinos
    - Filtros por grupo muscular e intervalo de datas
    - Paginação
    - Subrotas para adicionar, atualizar e remover exercícios individualmente
    - Agregação de volume total por grupo muscular
    
    Para testar, selecione um endpoint abaixo, clique em "Try it out", preencha os parâmetros e clique em "Execute".
servers:
  - url: https://diario-treinos-devapi.vercel.app/api
    description: Produção (Vercel)
  - url: http://localhost:3000/api
    description: Local

tags:
  - name: Treinos
    description: Operações de CRUD dos treinos
  - name: Exercícios
    description: Manipulação dos exercícios embutidos em cada treino
  - name: Estatísticas
    description: Estatísticas e agregações

paths:
  /workouts:
    post:
      tags: [Treinos]
      summary: Cria um treino
      description: Cria um novo treino com um array de exercícios embutidos. Cada exercício recebe um ID próprio.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkoutInput'
            example:
              title: Treino de Pernas
              date: "2026-11-22T08:00:00.000Z"
              durationMinutes: 45
              notes: Foco em agachamento
              exercises:
                - name: Agachamento Livre
                  muscleGroup: Pernas
                  equipment: Barra
                  sets: 4
                  reps: 8
                  weightKg: 60
                - name: Leg Press
                  muscleGroup: Pernas
                  equipment: Máquina
                  sets: 3
                  reps: 12
                  weightKg: 100
      responses:
        '201':
          description: Treino criado com sucesso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workout'
        '400':
          $ref: '#/components/responses/BadRequest'
    get:
      tags: [Treinos]
      summary: Lista treinos com filtros e paginação
      description: Retorna uma lista paginada de treinos. Aceita filtros por grupo muscular e intervalo de datas.
      parameters:
        - in: query
          name: muscleGroup
          description: Filtra treinos que contenham ao menos um exercício do grupo muscular informado
          schema:
            type: string
            enum: [Peito, Costas, Pernas, Ombros, Bíceps, Tríceps, Abdômen, Cardio]
        - in: query
          name: from
          description: Data inicial (formato ISO)
          schema: { type: string, format: date }
        - in: query
          name: to
          description: Data final (formato ISO)
          schema: { type: string, format: date }
        - in: query
          name: page
          description: Número da página
          schema: { type: integer, default: 1 }
        - in: query
          name: limit
          description: Quantidade de itens por página
          schema: { type: integer, default: 10 }
      responses:
        '200':
          description: Lista paginada de treinos
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer, example: 2 }
                  page: { type: integer, example: 1 }
                  limit: { type: integer, example: 10 }
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Workout'

  /workouts/{id}:
    parameters:
      - in: path
        name: id
        required: true
        description: ID do treino
        schema: { type: string }
    get:
      tags: [Treinos]
      summary: Busca treino por ID
      responses:
        '200':
          description: Treino encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workout'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Treinos]
      summary: Substitui o treino inteiro
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkoutInput'
      responses:
        '200':
          description: Treino atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workout'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [Treinos]
      summary: Atualização parcial
      description: "Atualiza apenas os campos enviados (ex: notes, title, durationMinutes)."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: string }
                notes: { type: string }
                durationMinutes: { type: integer }
            example:
              notes: Subi a carga do supino para 45kg
      responses:
        '200':
          description: Treino atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workout'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Treinos]
      summary: Remove treino
      responses:
        '204':
          description: Treino removido
        '404':
          $ref: '#/components/responses/NotFound'

  /workouts/{id}/exercises:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
    post:
      tags: [Exercícios]
      summary: Adiciona exercício ao treino
      description: Adiciona um novo exercício ao array do treino.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExerciseInput'
            example:
              name: Cadeira Extensora
              muscleGroup: Pernas
              equipment: Máquina
              sets: 3
              reps: 15
              weightKg: 40
      responses:
        '201':
          description: Exercício adicionado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workout'
        '404':
          $ref: '#/components/responses/NotFound'

  /workouts/{id}/exercises/{exerciseId}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string }
      - in: path
        name: exerciseId
        required: true
        schema: { type: string }
    patch:
      tags: [Exercícios]
      summary: Atualiza um exercício específico
      description: Atualiza apenas o exercício com o ID informado dentro do treino.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                sets: { type: integer }
                reps: { type: integer }
                weightKg: { type: number }
            example:
              weightKg: 45
              reps: 12
      responses:
        '200':
          description: Exercício atualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workout'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [Exercícios]
      summary: Remove exercício do treino
      description: Remove o exercício do array do treino.
      responses:
        '204':
          description: Exercício removido
        '404':
          $ref: '#/components/responses/NotFound'

  /workouts/stats:
    get:
      tags: [Estatísticas]
      summary: Volume total por grupo muscular
      description: |
        Calcula o volume total de treino por grupo muscular.
        - Total de Volume (kg): séries x repetições x carga
        - Total de Séries: soma das séries por grupo
      parameters:
        - in: query
          name: from
          schema: { type: string, format: date }
        - in: query
          name: to
          schema: { type: string, format: date }
      responses:
        '200':
          description: Resultado da agregação
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    muscleGroup: { type: string, example: Peito }
                    totalVolumeKg: { type: number, example: 1600 }
                    totalSets: { type: integer, example: 4 }

components:
  schemas:
    ExerciseInput:
      type: object
      required: [name, muscleGroup, sets, reps]
      properties:
        name: { type: string, example: Supino Reto }
        muscleGroup:
          type: string
          enum: [Peito, Costas, Pernas, Ombros, Bíceps, Tríceps, Abdômen, Cardio]
        equipment: { type: string, example: Barra }
        sets: { type: integer, minimum: 1, example: 4 }
        reps: { type: integer, minimum: 1, example: 10 }
        weightKg: { type: number, minimum: 0, example: 40 }
    Exercise:
      allOf:
        - $ref: '#/components/schemas/ExerciseInput'
        - type: object
          properties:
            _id: { type: string }
    WorkoutInput:
      type: object
      required: [title, date, exercises]
      properties:
        title: { type: string, example: Treino de Peito e Tríceps }
        date: { type: string, format: date-time, example: "2026-11-20T10:00:00.000Z" }
        durationMinutes: { type: integer, minimum: 1, example: 60 }
        notes: { type: string, example: Aumentei a carga no supino }
        exercises:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ExerciseInput'
    Workout:
      allOf:
        - $ref: '#/components/schemas/WorkoutInput'
        - type: object
          properties:
            _id: { type: string }
            exercises:
              type: array
              items:
                $ref: '#/components/schemas/Exercise'
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
  responses:
    BadRequest:
      description: Dados inválidos
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string, example: Dados inválidos }
              errors:
                type: array
                items: { type: string }
    NotFound:
      description: Recurso não encontrado
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string, example: Treino não encontrado }
